# DualGPU Minecraft Renderer - Gradle Properties

# Mod Information
mod_version=0.1.0-m1
mod_id=dualgpu
mod_name=DualGPU Renderer
mod_description=Experimental dual-GPU rendering backend for Minecraft

# Minecraft Version (Target: 1.21.4)
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.9

# Fabric API
fabric_api_version=0.110.0+1.21.4

# LWJGL/Vulkan
lwjgl_version=3.3.3
vulkan_bindings_version=3.3.3

# Java
java_version=21

# Build
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
